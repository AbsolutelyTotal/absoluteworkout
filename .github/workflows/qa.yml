# Runs the browser QA suite headless on every PR and every push to main, so a
# regression can't merge. No secrets — pure static site + Chromium.
name: QA

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install Playwright (Chromium)
        run: npm install playwright@1.48.2 && npx playwright install --with-deps chromium

      - name: Run QA suite
        run: |
          python3 -m http.server 8541 &
          server=$!
          trap 'kill $server' EXIT
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8541/tests.html >/dev/null && break
            sleep 0.5
          done
          node tests/ci-runner.mjs
