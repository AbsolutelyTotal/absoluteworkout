# Runs the browser QA suite headless on every PR and every push to main, so a
# regression can't merge. No secrets — pure static site + Chromium.
name: QA

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20

      - name: Install Playwright (Chromium)
        run: npm install playwright@1.48.2 && npx playwright install --with-deps chromium

      - name: Run QA suite
        run: |
          python3 -m http.server 8541 &
          server=$!
          trap 'kill $server' EXIT
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8541/tests.html >/dev/null && break
            sleep 0.5
          done
          node tests/ci-runner.mjs
