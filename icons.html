<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>absoluteworkout — icon contact sheet</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="app.css">
<style>
  main { max-width: 1100px; }
  .sheet { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 10px; }
  .cell {
    display: flex; flex-direction: column; align-items: center; gap: 7px;
    padding: 12px 8px; background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); text-align: center;
  }
  .cell .k { font-size: 11px; color: var(--ink-2); word-break: break-word; }
  .cell .icon-eq { width: 44px; height: 44px; color: var(--navy); }
</style>
</head>
<body>
<header class="appbar">
  <div class="wordmark"><span class="mark">absoluteworkout</span><span class="sep">·</span><span class="tag">icons</span></div>
  <div class="appbar-actions"><a class="icon-link" href="index.html" title="Back to the app">←</a></div>
</header>
<main>
  <div class="banner info" style="margin-bottom:16px">
    <span class="icon">i</span>
    <div>Dev contact sheet for the hand-authored SVGs. Not linked from the app —
      open it when adding an exercise to pick an <code>icon</code> key, or to check
      a body-map region after editing <code>src/icons/body.js</code>.</div>
  </div>

  <h3 style="margin-bottom:10px">Machines &amp; equipment</h3>
  <div class="sheet" id="eq"></div>

  <h3 style="margin:26px 0 10px">Muscle regions — front / back</h3>
  <div class="sheet" id="mm"></div>
</main>

<script type="module">
import { iconByKey, ICON_KEYS } from './src/icons/equipment.js';
import { bodyMap } from './src/icons/body.js';
import { mount, html } from './src/ui.js';

mount(document.getElementById('eq'),
  html`${ICON_KEYS.map(k => html`<div class="cell">${iconByKey(k)}<span class="k">${k}</span></div>`)}`);

const muscles = await fetch('data/muscles.json', { cache: 'no-store' }).then(r => r.json());
mount(document.getElementById('mm'),
  html`${muscles.map(m => html`<div class="cell">
    ${bodyMap({ primary: [m.id], view: 'both', height: 104 })}
    <span class="k">${m.name}</span>
  </div>`)}`);
</script>
</body>
</html>
