<!DOCTYPE html><html><head><meta charset="UTF-8"><title>exercise set</title>
<style>body{margin:0;background:#15171c;color:#e8e6e0;font:12px system-ui;padding:14px;width:1180px}
h1{font-size:14px;margin:0 0 10px}
.g{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.c{background:#1c1f27;border-radius:6px;overflow:hidden;position:relative}
.c img{width:100%;display:block}
.c b{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.82);font-size:9.5px;padding:2px 4px}
h2{font-size:13px;margin:16px 0 8px;color:#fbd96b}
.th{display:flex;gap:6px;flex-wrap:wrap}
.th span{width:88px;height:60px;border:2px solid #2b2c6b;border-radius:8px;overflow:hidden;background:#fdf2ea;display:block}
.th span img{width:100%;height:100%;object-fit:cover;display:block}</style></head><body>
<h1>All 31 exercise illustrations</h1><div class="g" id="g"></div>
<h2>At real row size (88×60)</h2><div class="th" id="t"></div>
<script>
fetch('../data/exercises.json').then(r=>r.json()).then(ex=>{
  document.getElementById('g').innerHTML=ex.map(e=>
    `<div class="c"><img src="../${e.image}"><b>${e.id}</b></div>`).join('');
  document.getElementById('t').innerHTML=ex.map(e=>
    `<span><img src="../${e.image}"></span>`).join('');
});
</script></body></html>
